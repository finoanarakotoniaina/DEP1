<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SuperCar Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="split-bg min-h-screen">
    <nav class="fixed top-0 w-full z-50 px-6 lg:px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter">SUPER<span class="text-[var(--crimson)]">CAR</span></div>
        
        <ul class="hidden md:flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center">
            <li><a href="acceuil.html" class="hover:text-[var(--crimson)] transition-colors">Accueil</a></li>
            <li><a href="voiture.html" class="hover:text-[var(--crimson)] transition-colors">Voitures</a></li>
            <li><a href="demande.html" class="text-[var(--crimson)]">Essai</a></li>
            <li><a href="services.html" class="hover:text-[var(--crimson)] transition-colors">Services</a></li>
            <li><a href="contact.html" class="hover:text-[var(--crimson)] transition-colors">Contact</a></li>
            <li><a href="connexion.html" class="border border-[var(--crimson)] px-4 py-2 hover:bg-[var(--crimson)] transition-all">Connexion</a></li>
        </ul>
    </nav>

    <section class="relative pt-32 pb-20 px-6 lg:px-24 overflow-hidden">
        <div class="absolute top-10 left-10 outline-text font-title text-8xl opacity-30 select-none uppercase">Contact</div>
        
        <div class="z-10 relative">
            <span class="text-[var(--marble)] font-bold tracking-[0.5em] uppercase mb-4 block">Disponibilité 24/7</span>
            <h1 class="font-title text-5xl md:text-7xl font-bold leading-none mb-8">
                RESTONS <br> <span class="text-[var(--crimson)]">CONNECTÉS.</span>
            </h1>
        </div>
    </section>

    <section class="px-6 lg:px-24 mb-20">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 border-y border-white/5 py-12">
            <div class="group">
                <span class="text-[var(--crimson)] font-title text-xs mb-2 block tracking-widest uppercase">Email</span>
                <p class="text-xl font-light group-hover:text-[var(--marble)] transition-colors">supercar@gmail.com</p>
            </div>
            <div class="group">
                <span class="text-[var(--crimson)] font-title text-xs mb-2 block tracking-widest uppercase">Téléphone</span>
                <p class="text-xl font-light group-hover:text-[var(--marble)] transition-colors">+230 9834 7627</p>
            </div>
            <div class="group">
                <span class="text-[var(--crimson)] font-title text-xs mb-2 block tracking-widest uppercase">Siège Social</span>
                <p class="text-xl font-light group-hover:text-[var(--marble)] transition-colors">BM-MCCI Building, Ebène, Maurice</p>
            </div>
        </div>
    </section>

    <section class="pb-32 px-6 lg:px-24 relative">
        <div class="absolute left-0 top-1/2 h-64 w-12 border-r border-white/5 flex items-center justify-center">
            <span class="vertical-text uppercase tracking-[1em] text-[10px] text-gray-600 font-bold">MESSAGE</span>
        </div>

        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-stretch">
            <div class="bg-white/5 p-8 lg:p-12 rounded-[40px] border border-white/10 backdrop-blur-sm">
                <form class="space-y-10">
                    <div class="grid grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Nom</label>
                            <input type="text" placeholder="VOTRE NOM" required class="floating-input w-full p-4 text-xs tracking-widest uppercase">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Prénom</label>
                            <input type="text" placeholder="VOTRE PRÉNOM" required class="floating-input w-full p-4 text-xs tracking-widest uppercase">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Email</label>
                        <input type="email" placeholder="VOTRE@EMAIL.COM" required class="floating-input w-full p-4 text-xs tracking-widest uppercase">
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Message</label>
                        <textarea rows="4" placeholder="COMMENT POUVONS-NOUS VOUS AIDER ?" class="floating-input w-full p-4 text-xs tracking-widest uppercase"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-[var(--crimson)] py-6 font-title text-xs tracking-[0.4em] uppercase hover:bg-white hover:text-black transition-all duration-500 shadow-xl">
                        Envoyer la demande
                    </button>
                </form>
            </div>

            <div class="map-container min-h-[500px] grayscale opacity-80 hover:grayscale-0 hover:opacity-100 transition-all duration-700 bg-black">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3744.137683936417!2d57.4819266!3d-20.2437632!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x217c5b1695555555%3A0x868b8e053a9856a9!2sMCCI%20Business%20School!5e0!3m2!1sfr!2smu!4v1700000000000!5m2!1sfr!2smu" 
                    class="w-full h-full border-none"
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </section>

    <footer class="py-20 border-t border-white/5 text-center">
        <div class="font-title text-[10vw] outline-text opacity-10 leading-none mb-8">SUPERCAR</div>
        <p class="text-[var(--varden)] opacity-40 text-xs tracking-[0.5em] uppercase">© 2026 Expertise Automobile - Ebène, Maurice</p>
    </footer>

</body>
</html>
