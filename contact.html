<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SuperCar Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --crimson: #dc143c;
            --marble: #f5f5f5;
        }
        .outline-text {
            -webkit-text-stroke: 1px rgba(255,255,255,0.2);
            color: transparent;
        }
    </style>
</head>
<body class="split-bg min-h-screen bg-black text-white">
    
   <nav class="fixed top-0 w-full z-50 px-6 lg:px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter">SUPER<span class="text-[var(--crimson)]">CAR</span></div>
        
        <ul class="hidden md:flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center">
            <li><a href="accueil.html" class="nav-link">Accueil</a></li>
            <li><a href="voiture.html" class="nav-link ">Voitures</a></li>
            <li><a href="demande.html" class="nav-link">Essai</a></li>
            <li><a href="services.html" class="nav-link">Services</a></li>
            <li><a href="contact.html" class="nav-link active">Contact</a></li>
            <li><a href="connexion.html">Connexion</a></li>
        </ul>
    </nav>

    <section class="relative pt-32 pb-20 px-6 lg:px-24 overflow-hidden">

        
        <div class="flex flex-col md:flex-row items-center justify-between w-full py-10 px-8">
    
    <div class="flex-1">
        <p class="text-blue-400 tracking-[0.3em] font-bold mb-2">DISPONIBILITÉ 24/7</p>
        <h1 class="font-title text-5xl md:text-7xl font-bold leading-none mb-0">
            RESTONS <br> 
            <span class="text-[var(--crimson)]">CONNECTÉS.</span>
        </h1>
    </div>

    <div class="flex-1 flex justify-center md:justify-end mt--20 md:mt--20">
        <div class="relative w-64 h-64 md:w-60 md:h-60 border-4 border-white rounded-full overflow-hidden shadow-2xl">
            <img 
                src="mercedes.jfif" 
                alt="Supercar" 
                class="w-full h-full object-cover"
            />
        </div>
    </div>

</div>
    </section>

    <section class="px-6 lg:px-24 mb-20">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 border-y border-white/5 py-12">
            <div class="group">
                <span class="text-[var(--crimson)] font-title text-xs mb-2 block tracking-widest uppercase">Email</span>
                <p class="text-xl font-light group-hover:text-[var(--marble)] transition-colors">supercar@gmail.com</p>
            </div>
            <div class="group">
                <span class="text-[var(--crimson)] font-title text-xs mb-2 block tracking-widest uppercase">Téléphone</span>
                <p class="text-xl font-light group-hover:text-[var(--marble)] transition-colors">+230 454 8950</p>
            </div>
            <div class="group">
                <span class="text-[var(--crimson)] font-title text-xs mb-2 block tracking-widest uppercase">Siège Social</span>
                <p class="text-xl font-light group-hover:text-[var(--marble)] transition-colors">MEF-MCCI Building, Ebène CyberCity</p>
            </div>
        </div>
    </section>

    <section class="pb-32 px-6 lg:px-24 relative">
        <div class="absolute left-0 top-1/2 h-64 w-12 border-r border-white/5 flex items-center justify-center -translate-y-1/2">
            <span style="writing-mode: vertical-rl;" class="uppercase tracking-[1em] text-[10px] text-gray-600 font-bold rotate-180">MESSAGE</span>
        </div>

        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-stretch">
            <div class="bg-white/5 p-8 lg:p-12 rounded-[40px] border border-white/10 backdrop-blur-sm">
                <form class="space-y-10">
                    <div class="grid grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Nom</label>
                            <input type="text" placeholder="VOTRE NOM" required class="bg-transparent border-b border-white/20 w-full p-4 text-xs tracking-widest focus:border-[var(--crimson)] outline-none transition-colors">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Prénom</label>
                            <input type="text" placeholder="VOTRE PRÉNOM" required class="bg-transparent border-b border-white/20 w-full p-4 text-xs tracking-widest focus:border-[var(--crimson)] outline-none transition-colors">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Email</label>
                        <input type="email" placeholder="VOTRE@EMAIL.COM" required class="bg-transparent border-b border-white/20 w-full p-4 text-xs tracking-widest focus:border-[var(--crimson)] outline-none transition-colors">
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-[0.3em] text-[var(--marble)]">Message</label>
                        <textarea rows="4" placeholder="COMMENT POUVONS-NOUS VOUS AIDER ?" class="bg-transparent border-b border-white/20 w-full p-4 text-xs tracking-widest focus:border-[var(--crimson)] outline-none transition-colors"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-[var(--crimson)] py-6 font-title text-xs tracking-[0.4em] uppercase hover:bg-white hover:text-black transition-all duration-500 shadow-xl">
                        Envoyer la demande
                    </button>
                </form>
            </div>

            <div class="map-container min-h-[500px] grayscale opacity-80 hover:grayscale-0 hover:opacity-100 transition-all duration-700 bg-zinc-900 rounded-[40px] overflow-hidden border border-white/10">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3743.766792686737!2d57.48742837584102!3d-20.227003448259695!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x217c5b1ec2170f63%3A0xd1a78020fc096491!2sMCCI%20BUSINESS%20SCHOOL!5e0!3m2!1sfr!2smu!4v1700000000000!5m2!1sfr!2smu" 
                    class="w-full h-full min-h-[500px] border-none"
                    allowfullscreen="" 
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </section>

    <footer class="py-20 border-t border-white/5 text-center">
        <div class="font-title text-[10vw] outline-text opacity-10 leading-none mb-8 uppercase">SUPERCAR</div>
        <p class="text-white opacity-40 text-xs tracking-[0.5em] uppercase">© 2026 Expertise Automobile - Ebène, Maurice</p>
    </footer>

</body>
</html>
