<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- STRUCTURE DU SCROLL --- */
        .row-wrapper {
            position: relative;
            padding: 0 40px;
            margin-bottom: 60px;
            overflow: visible !important;
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 25px;
            padding: 50px 10px;
            scrollbar-width: none;
            overflow-y: visible !important;
            /* Empêche le scroll manuel pour forcer l'usage des boutons par blocs */
            scroll-snap-type: x mandatory; 
        }
        .story-row::-webkit-scrollbar { display: none; }

        /* --- TA BOX VOITURE --- */
        .car-card {
            min-width: calc(33.333% - 20px); /* Affiche exactement 3 voitures par vue */
            flex-shrink: 0;
            position: relative;
            transition: transform 0.4s ease;
            z-index: 10;
            scroll-snap-align: start;
        }

        /* --- PANNEAU INFOS ADAPTATIF --- */
        .hover-specs {
            position: absolute;
            top: 0;
            width: 280px;
            height: 100%;
            background: #b91c1c; 
            color: white;
            padding: 30px;
            border-radius: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        /* Par défaut : s'ouvre à droite */
        .car-card .hover-specs { left: 105%; }

        /* Pour la 3ème et la 6ème voiture de chaque ligne : s'ouvre vers la GAUCHE */
        .car-card:nth-child(3n) .hover-specs {
            left: auto !important;
            right: 105% !important;
        }

        /* HOVER */
        .car-card:hover { transform: scale(1.05); z-index: 1000 !important; }
        .car-card:hover .hover-specs { opacity: 1; visibility: visible; }

        /* --- BOUTONS PETITS CERCLES TRANSPARENTS --- */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            font-size: 12px;
        }
        .nav-btn:hover { background: white; color: black; border-color: white; }
        .btn-prev { left: 0; }
        .btn-next { right: 0; }

        .spec-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 12px 0;
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="split-bg">

    <nav class="fixed top-0 w-full z-[2000] px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter uppercase text-white">SUPER<span class="text-[#b91c1c]">CAR</span></div>
        <ul class="flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center text-white">
            <li><a href="acceuil.html">Accueil</a></li>
            <li><a href="voiture.html" class="text-[#b91c1c]">Voitures</a></li>
            <li><a href="demande.html">Essai</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="connexion.html" class="border border-[#b91c1c] px-4 py-2">Connexion</a></li>
        </ul>
    </nav>

    <main class="pt-40">
        <div class="px-24 mb-12">
            <h1 class="font-title text-5xl text-white uppercase tracking-tighter">Inventaire <span class="text-[#b91c1c]">Privé</span></h1>
        </div>

        <section class="mb-20">
            <h2 class="font-title text-xl px-24 mb-4 text-white opacity-40 uppercase">BMW Performance</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollByThree('row-bmw', -1)">❮</button>
                <div class="story-row" id="row-bmw">
                    </div>
                <button class="nav-btn btn-next" onclick="scrollByThree('row-bmw', 1)">❯</button>
            </div>
        </section>

        <section class="mb-20">
            <h2 class="font-title text-xl px-24 mb-4 text-white opacity-40 uppercase">Mercedes AMG</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollByThree('row-merc', -1)">❮</button>
                <div class="story-row" id="row-merc"></div>
                <button class="nav-btn btn-next" onclick="scrollByThree('row-merc', 1)">❯</button>
            </div>
        </section>

        <section class="mb-20">
            <h2 class="font-title text-xl px-24 mb-4 text-white opacity-40 uppercase">Porsche Kolektion</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollByThree('row-porsche', -1)">❮</button>
                <div class="story-row" id="row-porsche"></div>
                <button class="nav-btn btn-next" onclick="scrollByThree('row-porsche', 1)">❯</button>
            </div>
        </section>
    </main>

    <script>
        const carData = {
            etat: "Neuf", km: "0 km", annee: "2024", carburant: "Essence", dispo: "En Stock"
        };

        const brands = {
            'row-bmw': ['M4 Competition', 'M5 CS', 'M8 GC', 'X6 M', 'M2 Coupe', 'i7 M70'],
            'row-merc': ['GT 63 S', 'G 63', 'SL 63', 'EQS 53', 'C 63 S', 'AMG One'],
            'row-porsche': ['911 GT3 RS', 'Taycan S', '718 GT4', '911 Turbo', 'Macan GTS', '918 Spyder']
        };

        function init() {
            for (let id in brands) {
                const row = document.getElementById(id);
                row.innerHTML = brands[id].map((name, index) => `
                    <div class="car-card">
                        <div class="hover-specs">
                            <p class="font-title text-[10px] mb-4 border-b border-white/20 pb-2 text-center uppercase">Specs</p>
                            <div class="spec-item"><span>État</span> <span>${carData.etat}</span></div>
                            <div class="spec-item"><span>Kilométrage</span> <span>${carData.km}</span></div>
                            <div class="spec-item"><span>Année</span> <span>${carData.annee}</span></div>
                            <div class="spec-item"><span>Énergie</span> <span>${carData.carburant}</span></div>
                        </div>
                        <img src="${id.split('-')[1]}${index+1}.jpg" class="w-full h-64 object-cover rounded-t-[24px]">
                        <div class="p-8 bg-white/5 rounded-b-[24px]">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[#b91c1c] font-bold text-[10px] uppercase">${carData.dispo}</span>
                                <span class="text-gray-500 text-[10px] font-bold uppercase">V8 Turbo</span>
                            </div>
                            <h3 class="font-title text-lg mb-4 text-white uppercase">${name}</h3>
                            <p class="font-bold text-2xl text-white">Sur Demande</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        // SCROLL PAR BLOC DE 3
        function scrollByThree(id, direction) {
            const container = document.getElementById(id);
            const cardWidth = container.querySelector('.car-card').offsetWidth + 25; // Largeur + gap
            container.scrollBy({ left: direction * (cardWidth * 3), behavior: 'smooth' });
        }

        init();
    </script>
</body>
</html>
