<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Ajustements spécifiques pour le panneau rouge sans casser ton style global */
        .row-wrapper {
            position: relative;
            padding: 0 60px;
            margin-bottom: 40px;
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 25px;
            padding: 50px 10px;
            scrollbar-width: none;
            clip-path: inset(-100px -500px -100px -500px);
        }
        .story-row::-webkit-scrollbar { display: none; }

        .car-card {
            min-width: 350px;
            flex-shrink: 0;
            position: relative;
            transition: all 0.4s ease;
        }

        /* --- LE PANNEAU ROUGE --- */
        .hover-specs {
            position: absolute;
            top: 0;
            width: 280px;
            height: 100%;
            background: #b91c1c; 
            color: white;
            padding: 30px;
            border-radius: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        /* POSITION NORMALE (À DROITE) */
        .car-card .hover-specs { 
            left: 105%; 
        }

        /* EXCEPTION DERNIÈRE VOITURE : ON RAMÈNE À GAUCHE (VERS LE CENTRE) */
        .car-card.pos-last .hover-specs { 
            left: auto !important;
            right: 105% !important;
        }

        /* EXCEPTION PREMIÈRE VOITURE : ON S'ASSURE QU'ELLE RESTE À DROITE (VERS LE CENTRE) */
        .car-card.pos-first .hover-specs {
            left: 105% !important;
            right: auto !important;
        }

        .car-card:hover .hover-specs { 
            opacity: 1; 
            visibility: visible; 
        }
        
        .car-card:hover { 
            z-index: 600; 
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 0;
            font-size: 11px;
            text-transform: uppercase;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            z-index: 1000;
            cursor: pointer;
        }
    </style>
</head>
<body class="split-bg">

    <nav class="fixed top-0 w-full z-[2000] px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter uppercase">SUPER<span class="text-[#b91c1c]">CAR</span></div>
        <ul class="flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center text-white">

    <main class="pt-40">
        <div class="px-24 mb-16">
            <h1 class="font-title text-6xl mb-4">NOS <span class="text-[#b91c1c]">MODÈLES</span></h1>
            <div class="w-32 h-1 bg-[#b91c1c]"></div>
        </div>

        <section>
            <h2 class="font-title text-xl px-24 mb-4 opacity-40 text-white uppercase tracking-widest">BMW</h2>
            <div class="row-wrapper">
                <button class="nav-btn left-2 text-white" onclick="scrollR('row-bmw', -1)">❮</button>
                <div class="story-row" id="row-bmw"></div>
                <button class="nav-btn right-2 text-white" onclick="scrollR('row-bmw', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-xl px-24 mb-4 opacity-40 text-white uppercase tracking-widest">MERCEDES</h2>
            <div class="row-wrapper">
                <button class="nav-btn left-2 text-white" onclick="scrollR('row-merc', -1)">❮</button>
                <div class="story-row" id="row-merc"></div>
                <button class="nav-btn right-2 text-white" onclick="scrollR('row-merc', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-xl px-24 mb-4 opacity-40 text-white uppercase tracking-widest">PORSCHE</h2>
            <div class="row-wrapper">
                <button class="nav-btn left-2 text-white" onclick="scrollR('row-porsche', -1)">❮</button>
                <div class="story-row" id="row-porsche"></div>
                <button class="nav-btn right-2 text-white" onclick="scrollR('row-porsche', 1)">❯</button>
            </div>
        </section>
    </main>

    <script>
        function inject(rowId, data) {
            const container = document.getElementById(rowId);
            container.innerHTML = data.map((car, index) => {
                // Détection de la première et dernière voiture pour le placement du panneau
                let edge = "";
                if (index === 0) edge = "pos-first";
                if (index === data.length - 1) edge = "pos-last";

                return `
                <div class="car-card ${edge}">
                    <div class="hover-specs">
                        <p class="font-title text-[10px] mb-4 border-b border-white/20 pb-2 text-center uppercase">Specs</p>
                        <div class="spec-item"><span>État</span> <span>${car.etat}</span></div>
                        <div class="spec-item"><span>Kilométrage</span> <span>${car.km}</span></div>
                        <div class="spec-item"><span>Année</span> <span>${car.annee}</span></div>
                        <div class="spec-item"><span>Énergie</span> <span>${car.carburant}</span></div>
                    </div>
                    <img src="${car.img}" class="w-full h-64 object-cover rounded-t-[24px]">
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[#b91c1c] font-bold text-[10px] uppercase">${car.dispo}</span>
                            <span class="text-gray-500 text-[10px] font-bold">${car.mot}</span>
                        </div>
                        <h3 class="font-title text-lg mb-4 text-white uppercase">${car.nom}</h3>
                        <p class="font-bold text-2xl text-white">${car.prix}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function scrollR(id, dir) {
            document.getElementById(id).scrollBy({ left: dir * 400, behavior: 'smooth' });
        }

        // Tes 18 voitures (6 par rangée)
        const bmw = [
            { img: 'bmw1.jpg', nom: 'M4 Competition', prix: 'Rs 5.2M', mot: 'V6 Biturbo', dispo: 'En Stock', etat: 'Neuf', km: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw2.jpg', nom: 'M5 CS', prix: 'Rs 7.8M', mot: 'V8 Twin', dispo: 'Limitée', etat: 'Occasion', km: '12k km', annee: '2022', carburant: 'Essence' },
            { img: 'bmw3.jpg', nom: 'M8 Gran Coupe', prix: 'Rs 8.5M', mot: 'V8 Turbo', dispo: 'En Stock', etat: 'Neuf', km: '0 km', annee: '2023', carburant: 'Essence' },
            { img: 'bmw4.jpg', nom: 'X5 M', prix: 'Rs 6.5M', mot: 'V8 Turbo', dispo: 'En Stock', etat: 'Neuf', km: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw5.jpg', nom: 'M2 Coupe', prix: 'Rs 4.1M', mot: 'L6 Turbo', dispo: 'Disponible', etat: 'Neuf', km: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw6.jpg', nom: 'i7 M70', prix: 'Rs 9.2M', mot: 'Électrique', dispo: 'En Stock', etat: 'Neuf', km: '0 km', annee: '2024', carburant: 'Élec' }
        ];

            { img: 'merc2.jpg', nom: 'AMG G 63', prix: 'Rs 9.5M', mot: 'V8 Biturbo', dispo: 'Sur Commande', etat: 'Neuf', km: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'merc3.jpg', nom: 'EQE 53 AMG', prix: 'Rs 8.9M', mot: 'Électrique', dispo: 'Disponible', etat: 'Neuf', km: '0 km', annee: '2024', carburant: 'Élec' },
            { img: 'merc4.jpg', nom: 'SL 63 AMG', prix: 'Rs 11.2M', mot: 'V8 Turbo', dispo: 'En Stock', etat: 'Neuf', km: '0 km', annee: '2024', carburant: 'Essence' },

        inject('row-bmw', bmw);

</body>
</html>
