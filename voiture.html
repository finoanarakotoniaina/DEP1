<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- Styles des Boutons de Navigation --- */
        .row-wrapper {
            position: relative;
            /* Padding latéral pour les boutons et vertical pour éviter la coupure du zoom */
            padding: 40px 60px; 
            margin-top: -40px; /* Compense le padding pour l'alignement */
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 25px;
            /* IMPORTANT : On ajoute du padding en haut et bas pour que le zoom ne soit pas coupé par l'overflow */
            padding: 30px 10px; 
            scrollbar-width: none;
            /* Permet aux éléments enfants de déborder visuellement sans être coupés immédiatement */
            clip-path: inset(-100px 0px -100px 0px); 
        }

        .story-row::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background-color: white;
            color: black;
            transform: translateY(-50%) scale(1.1);
        }

        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        /* --- Style de la Carte avec Zoom corrigé --- */
        .car-card {
            min-width: 350px;
            flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
            position: relative;
        }

        .car-card:hover {
            /* Un zoom plus doux qui ne sort pas des limites grâce au padding parent */
            transform: scale(1.05); 
            z-index: 20;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Empêche les images de déborder de l'arrondi de la carte lors du zoom */
        .car-card img {
            transition: transform 0.4s ease;
        }
    </style>
</head>
<body class="split-bg">

    <div class="main-container">
        <nav class="fixed top-0 w-full z-50 px-6 lg:px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
            <div class="font-title text-xl tracking-tighter">SUPER<span class="text-[var(--crimson)]">CAR</span></div>
            <ul class="hidden md:flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center">
                <li><a href="acceuil.html" class="hover:text-[var(--crimson)] transition-colors">Accueil</a></li>
                <li><a href="voiture.html" class="text-[var(--crimson)]">Voitures</a></li>
                <li><a href="demande.html" class="hover:text-[var(--crimson)] transition-colors">Essai</a></li>
                <li><a href="services.html" class="hover:text-[var(--crimson)] transition-colors">Services</a></li>
                <li><a href="contact.html" class="hover:text-[var(--crimson)] transition-colors">Contact</a></li>
                <li><a href="connexion.html" class="border border-[var(--crimson)] px-4 py-2 hover:bg-[var(--crimson)] transition-all">Connexion</a></li>
            </ul>
        </nav>

        <main class="pt-40">
            <div class="section-header px-6 lg:px-24 mb-10 relative">
                <div class="absolute left-0 -top-10 outline-text font-title text-8xl opacity-10 select-none uppercase">Inventaire</div>
                <span class="text-[var(--marble)] font-bold tracking-[0.5em] uppercase mb-2 block">Collection Exclusive</span>
                <h1 class="font-title text-5xl md:text-7xl mb-4">NOS <span class="text-[var(--crimson)]">MODÈLES</span></h1>
                <div class="w-32 h-1 bg-[var(--crimson)]"></div>
            </div>

            <section class="mb-10">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest">BMW</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-bmw', -1)">❮</button>
                    <div class="story-row" id="row-bmw"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-bmw', 1)">❯</button>
                </div>
            </section>

            <section class="mb-10">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest">Mercedes Benz</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-mercedes', -1)">❮</button>
                    <div class="story-row" id="row-mercedes"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-mercedes', 1)">❯</button>
                </div>
            </section>

            <section class="mb-10">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest">Porsche</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-porsche', -1)">❮</button>
                    <div class="story-row" id="row-porsche"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-porsche', 1)">❯</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        function injectCars(rowId, carList) {
            const row = document.getElementById(rowId);
            if (!row) return;

            let html = '';
            carList.forEach((car, index) => {
                const sideClass = ((index + 1) % 3 === 0) ? 'specs-left' : '';
                html += `
                <div class="car-card ${sideClass}">
                    <div class="relative overflow-hidden rounded-t-[24px]">
                        <img src="${car.img}" alt="${car.name || car.nom}" class="w-full h-64 object-cover">
                    </div>
                    <div class="p-8">
                        <span class="text-[var(--crimson)] font-title text-[10px] mb-2 block uppercase">${car.tag || 'Disponible'}</span>
                        <h3 class="font-title text-lg uppercase mb-6">${car.name || car.nom}</h3>
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-xl text-[var(--varden)]">${car.price || car.prix}</p>
                            <button class="bg-[var(--crimson)] px-6 py-2 text-[10px] font-title uppercase tracking-widest hover:bg-white hover:text-black transition-all">Détails</button>
                        </div>
                    </div>
                </div>`;
            });
            row.innerHTML = html;
        }

        function scrollRow(rowId, direction) {
            const row = document.getElementById(rowId);
            const scrollAmount = 375; 
            row.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        // --- Données (6 voitures par marque) ---
        const bmwData = [
            { img: 'bmw1.jpg', name: 'M4 Competition', price: 'Rs 5.2M', tag: 'M-Power' },
            { img: 'bmw2.jpg', name: 'M5 CS', price: 'Rs 7.8M', tag: 'Limited' },
            { img: 'bmw3.jpg', name: 'M8 Gran Coupe', price: 'Rs 8.5M', tag: 'V8 Turbo' },
            { img: 'bmw4.jpg', name: 'Z4 M40i', price: 'Rs 3.9M', tag: 'Roadster' },
            { img: 'bmw5.jpg', name: 'X6 M Competition', price: 'Rs 6.5M', tag: 'SUV Sport' },
            { img: 'bmw6.jpg', name: 'i8 Roadster', price: 'Rs 7.2M', tag: 'Hybrid' }
        ];

        const mercedesData = [
            { img: 'merc1.jpg', nom: 'AMG CLA 45 S', prix: 'Rs 3.5M', tag: 'AMG' },
            { img: 'merc2.jpg', nom: 'AMG G 63', prix: 'Rs 9.3M', tag: 'Legend' },
            { img: 'merc3.jpg', nom: 'AMG EQE Berline', prix: 'Rs 9.2M', tag: 'Electric' },
            { img: 'merc4.jpg', nom: 'AMG SL Roadster', prix: 'Rs 8.1M', tag: 'Luxury' },
            { img: 'merc5.jpg', nom: 'AMG GT 63 S', prix: 'Rs 10.5M', tag: 'Biturbo' },
            { img: 'merc6.jpg', nom: 'AMG One', prix: 'Rs 85M', tag: 'Hypercar' }
        ];

        const porscheData = [
            { img: 'p1.jpg', name: '911 GT3 RS', price: 'Rs 15M', tag: 'Track Tool' },
            { img: 'p2.jpg', name: 'Taycan Turbo S', price: 'Rs 9.5M', tag: 'Electric' },
            { img: 'p3.jpg', name: '718 Cayman GT4', price: 'Rs 6.2M', tag: 'Pure' },
            { img: 'p4.jpg', name: 'Panamera Turbo', price: 'Rs 8.8M', tag: 'Executive' },
            { img: 'p5.jpg', name: 'Macan GTS', price: 'Rs 4.5M', tag: 'SUV Performance' },
            { img: 'p6.jpg', name: '918 Spyder', price: 'Rs 65M', tag: 'Iconic' }
        ];

        injectCars('row-bmw', bmwData);
        injectCars('row-mercedes', mercedesData);
        injectCars('row-porsche', porscheData);
    </script>
</body>
</html>
