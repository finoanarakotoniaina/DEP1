<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        .row-wrapper {
            position: relative;
            padding: 0 60px;
            margin-bottom: 40px;
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 25px;
            padding: 50px 10px;
            scrollbar-width: none;
        }

        .story-row::-webkit-scrollbar { display: none; }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .nav-btn:hover { background: white; color: black; }
        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        .car-card {
            min-width: 350px;
            flex-shrink: 0;
            position: relative;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            transition: transform 0.4s ease;
        }

        /* --- LA SOLUTION : PANNEAU FIXE AU CENTRE --- */
        .hover-specs {
            position: fixed; /* Fixé par rapport à l'écran */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centrage parfait */
            width: 320px;
            height: 450px;
            background: #b91c1c; 
            color: white;
            padding: 40px;
            border-radius: 30px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 3000; /* Au-dessus de tout */
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        /* Quand on survole n'importe quelle carte, le panneau central s'affiche */
        .car-card:hover .hover-specs { 
            opacity: 1; 
            visibility: visible; 
        }

        /* Petit zoom sur la carte survolée */
        .car-card:hover { 
            transform: scale(1.05); 
            z-index: 10;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 15px 0;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
</head>
<body class="split-bg">

    <nav class="fixed top-0 w-full z-[2000] px-6 lg:px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter text-white">SUPER<span class="text-[var(--crimson)]">CAR</span></div>
        <ul class="hidden md:flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center text-white">
            <li><a href="acceuil.html" class="hover:text-[var(--crimson)]">Accueil</a></li>
            <li><a href="voiture.html" class="text-[var(--crimson)]">Voitures</a></li>
            <li><a href="demande.html" class="hover:text-[var(--crimson)]">Essai</a></li>
            <li><a href="services.html" class="hover:text-[var(--crimson)]">Services</a></li>
            <li><a href="contact.html" class="hover:text-[var(--crimson)]">Contact</a></li>
            <li><a href="connexion.html" class="border border-[var(--crimson)] px-4 py-2 hover:bg-[var(--crimson)]">Connexion</a></li>
        </ul>
    </nav>

    <main class="pt-40">
        <div class="section-header px-6 lg:px-24 mb-16 relative text-white">
            <div class="absolute left-0 -top-10 outline-text font-title text-8xl opacity-10 select-none uppercase">Inventaire</div>
            <span class="text-gray-400 font-bold tracking-[0.5em] uppercase mb-2 block">Collection Exclusive</span>
            <h1 class="font-title text-5xl md:text-7xl mb-4 uppercase">NOS <span class="text-[var(--crimson)]">MODÈLES</span></h1>
            <div class="w-32 h-1 bg-[var(--crimson)]"></div>
        </div>

        <section>
            <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest text-white">BMW</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollRow('row-bmw', -1)">❮</button>
                <div class="story-row" id="row-bmw"></div>
                <button class="nav-btn btn-next" onclick="scrollRow('row-bmw', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest text-white">MERCEDES BENZ</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollRow('row-mercedes', -1)">❮</button>
                <div class="story-row" id="row-mercedes"></div>
                <button class="nav-btn btn-next" onclick="scrollRow('row-mercedes', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest text-white">PORSCHE</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollRow('row-porsche', -1)">❮</button>
                <div class="story-row" id="row-porsche"></div>
                <button class="nav-btn btn-next" onclick="scrollRow('row-porsche', 1)">❯</button>
            </div>
        </section>
    </main>

    <script>
        function injectCars(rowId, carList) {
            const row = document.getElementById(rowId);
            let html = '';
            carList.forEach((car) => {
                html += `
                <div class="car-card">
                    <div class="hover-specs">
                        <p class="font-title text-[12px] mb-6 border-b border-white pb-3 tracking-widest text-center">SPÉCIFICATIONS</p>
                        <div class="spec-item"><span>État:</span> <span>${car.etat}</span></div>
                        <div class="spec-item"><span>Kilométrage:</span> <span>${car.kilometrage}</span></div>
                        <div class="spec-item"><span>Année:</span> <span>${car.annee}</span></div>
                        <div class="spec-item"><span>Carburant:</span> <span>${car.carburant}</span></div>
                        <p class="text-[10px] mt-6 opacity-60 text-center uppercase tracking-widest">${car.nom}</p>
                    </div>
                    <div class="relative overflow-hidden rounded-t-[24px]">
                        <img src="${car.img}" class="w-full h-64 object-cover" alt="${car.nom}">
                    </div>
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[#b91c1c] font-title text-[9px] uppercase tracking-wider">${car.disponibilite}</span>
                            <span class="text-gray-500 text-[10px] uppercase font-bold">${car.motorisation}</span>
                        </div>
                        <h3 class="font-title text-lg uppercase mb-4 text-white">${car.nom}</h3>
                        <p class="font-bold text-2xl text-white">${car.prix}</p>
                    </div>
                </div>`;
            });
            row.innerHTML = html;
        }

        function scrollRow(rowId, direction) {
            document.getElementById(rowId).scrollBy({ left: direction * 380, behavior: 'smooth' });
        }

        const bmwData = [
            { img: 'bmw1.jpg', nom: 'M4 Competition', prix: 'Rs 5.2M', motorisation: 'V6 Biturbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw2.jpg', nom: 'M5 CS', prix: 'Rs 7.8M', motorisation: 'V8 M-Twin', disponibilite: 'Limitée', etat: 'Occasion', kilometrage: '12k km', annee: '2022', carburant: 'Essence' },
            { img: 'bmw3.jpg', nom: 'M8 Gran Coupe', prix: 'Rs 8.5M', motorisation: 'V8 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '200 km', annee: '2023', carburant: 'Essence' },
            { img: 'bmw4.jpg', nom: 'X6 M Competition', prix: 'Rs 6.9M', motorisation: 'V8 Biturbo', disponibilite: 'Disponible', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw5.jpg', nom: 'M2 Coupe', prix: 'Rs 4.5M', motorisation: 'L6 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw6.jpg', nom: 'i7 M70', prix: 'Rs 9.5M', motorisation: 'Électrique', disponibilite: 'Rare', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Élec' }
        ];

        const mercedesData = [
            { img: 'merc1.jpg', nom: 'AMG GT 63 S', prix: 'Rs 10.2M', motorisation: 'V8 Twin-Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '100 km', annee: '2023', carburant: 'Essence' },
            { img: 'merc2.jpg', nom: 'AMG G 63', prix: 'Rs 9.5M', motorisation: 'V8 Biturbo', disponibilite: 'Sur Commande', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'merc3.jpg', nom: 'EQE 53 AMG', prix: 'Rs 8.9M', motorisation: 'Électrique', disponibilite: 'Disponible', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Élec' },
            { img: 'merc4.jpg', nom: 'SL 63 AMG', prix: 'Rs 11.5M', motorisation: 'V8 Biturbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'merc5.jpg', nom: 'C63 S E-Perf', prix: 'Rs 5.9M', motorisation: 'Hybride AMG', disponibilite: 'Disponible', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Hybride' },
            { img: 'merc6.jpg', nom: 'AMG One', prix: 'Rs 135M', motorisation: 'V6 F1 Hybrid', disponibilite: 'Collection', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' }
        ];

        const porscheData = [
            { img: 'p1.jpg', nom: '911 GT3 RS', prix: 'Rs 15.2M', motorisation: '6 Cyl. Flat', disponibilite: 'Rare', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'p2.jpg', nom: 'Taycan Turbo S', prix: 'Rs 9.8M', motorisation: 'Électrique', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Électrique' },
            { img: 'p3.jpg', nom: '718 Cayman GT4', prix: 'Rs 6.5M', motorisation: 'Flat 6', disponibilite: 'Disponible', etat: 'Occasion', kilometrage: '8k km', annee: '2022', carburant: 'Essence' },
            { img: 'p4.jpg', nom: 'Panamera Turbo S', prix: 'Rs 8.7M', motorisation: 'V8 Hybrid', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Hybride' },
            { img: 'p5.jpg', nom: 'Macan GTS', prix: 'Rs 4.9M', motorisation: 'V6 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'p6.jpg', nom: '918 Spyder', prix: 'Rs 78M', motorisation: 'V8 Hybrid', disponibilite: 'Collection', etat: 'Occasion', kilometrage: '1.5k km', annee: '2015', carburant: 'Hybride' }
        ];

        injectCars('row-bmw', bmwData);
        injectCars('row-mercedes', mercedesData);
        injectCars('row-porsche', porscheData);
    </script>
</body>
</html>
