<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --crimson: #b91c1c; }
        body { background-color: #051923; color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .font-title { font-family: 'Syncopate', sans-serif; }

        .row-wrapper {
            position: relative;
            padding: 0 60px;
            margin-bottom: 40px;
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 25px;
            padding: 50px 10px;
            scrollbar-width: none;
            /* Permet de voir le panneau rouge même s'il déborde de la rangée */
            clip-path: inset(-100px -500px -100px -500px);
        }
        .story-row::-webkit-scrollbar { display: none; }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: white;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .nav-btn:hover { background: white; color: black; }

        .car-card {
            min-width: 350px;
            flex-shrink: 0;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- LE PANNEAU DE SPÉCIFICATIONS --- */
        .hover-specs {
            position: absolute;
            top: 0;
            width: 280px;
            height: 100%;
            background: var(--crimson); 
            color: white;
            padding: 30px;
            border-radius: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        /* PAR DÉFAUT : S'OUVRE À DROITE */
        .car-card .hover-specs { 
            left: 105%; 
            box-shadow: 20px 0 40px rgba(0,0,0,0.4);
        }

        /* EXCEPTION POUR LA DERNIÈRE VOITURE : S'OUVRE À GAUCHE (VERS LE CENTRE) */
        .car-card.pos-last .hover-specs { 
            left: auto !important;
            right: 105% !important;
            box-shadow: -20px 0 40px rgba(0,0,0,0.4);
        }

        .car-card:hover { transform: scale(1.02); z-index: 600; border-color: var(--crimson); }
        .car-card:hover .hover-specs { opacity: 1; visibility: visible; }

        .spec-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 0;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-[2000] px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter uppercase">SUPER<span class="text-[#b91c1c]">CAR</span></div>
        <ul class="flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center">
            <li><a href="#" class="hover:text-[#b91c1c]">Accueil</a></li>
            <li><a href="#" class="text-[#b91c1c]">Voitures</a></li>
            <li><a href="#" class="hover:text-[#b91c1c]">Essai</a></li>
            <li><a href="#" class="hover:text-[#b91c1c]">Contact</a></li>
            <li><a href="#" class="border border-[#b91c1c] px-4 py-2 hover:bg-[#b91c1c]">Connexion</a></li>
        </ul>
    </nav>

    <main class="pt-40 pb-20">
        <div class="px-24 mb-16">
            <h1 class="font-title text-6xl mb-4">NOS <span class="text-[#b91c1c]">MODÈLES</span></h1>
            <div class="w-32 h-1 bg-[#b91c1c]"></div>
        </div>

        <section>
            <h2 class="font-title text-xl px-24 mb-4 opacity-40 tracking-widest uppercase">BMW Performance</h2>
            <div class="row-wrapper">
                <button class="nav-btn left-4" onclick="scrollR('row1', -1)">❮</button>
                <div class="story-row" id="row1"></div>
                <button class="nav-btn right-4" onclick="scrollR('row1', 1)">❯</button>
            </div>
        </section>
    </main>

    <script>
        const cars = [
            { img: 'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80', nom: 'M4 COMPETITION', prix: 'Rs 5.2M', mot: 'V6 BITURBO', dispo: 'EN STOCK' },
            { img: 'https://images.unsplash.com/photo-1617531653332-bd46c24f2068?auto=format&fit=crop&w=800&q=80', nom: 'M5 CS', prix: 'Rs 7.8M', mot: 'V8 TWIN', dispo: 'LIMITÉE' },
            { img: 'https://images.unsplash.com/photo-1603553323145-38507f776263?auto=format&fit=crop&w=800&q=80', nom: 'M8 GRAN COUPE', prix: 'Rs 8.5M', mot: 'V8 TURBO', dispo: 'EN STOCK' }
        ];

        function inject(id, data) {
            const container = document.getElementById(id);
            container.innerHTML = data.map((car, index) => {
                // Si c'est le dernier élément de la liste, on lui donne la classe 'pos-last'
                const isLast = (index === data.length - 1) ? 'pos-last' : '';
                
                return `
                <div class="car-card ${isLast}">
                    <div class="hover-specs">
                        <p class="font-title text-[10px] mb-6 border-b border-white/30 pb-2 text-center">SPÉCIFICATIONS</p>
                        <div class="spec-item"><span>État</span> <span>Neuf</span></div>
                        <div class="spec-item"><span>Kilométrage</span> <span>0 KM</span></div>
                        <div class="spec-item"><span>Année</span> <span>2024</span></div>
                        <div class="spec-item"><span>Carburant</span> <span>Essence</span></div>
                    </div>
                    <img src="${car.img}" class="w-full h-64 object-cover rounded-t-[24px]">
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[#b91c1c] font-bold text-[10px] uppercase">${car.dispo}</span>
                            <span class="text-gray-500 text-[10px] font-bold">${car.mot}</span>
                        </div>
                        <h3 class="font-title text-lg mb-4">${car.nom}</h3>
                        <p class="font-bold text-2xl">${car.prix}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function scrollR(id, dir) {
            document.getElementById(id).scrollBy({ left: dir * 400, behavior: 'smooth' });
        }

        inject('row1', cars);
    </script>
</body>
</html>
