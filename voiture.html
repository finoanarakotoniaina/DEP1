<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson: #C1121F;
            --cosmos: #003049;
            --marble: #669BBC;
            --varden: #FFF6D6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cosmos);
            color: white;
            margin: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .font-title { font-family: 'Syncopate', sans-serif; }

        .split-bg {
            background: linear-gradient(160deg, var(--cosmos) 60%, #001a2a 60.1%);
        }

        .outline-text {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.15);
        }

        /* --- EFFET DE FOCUS --- */
        .main-container:has(.car-card:hover) nav,
        .main-container:has(.car-card:hover) .section-header {
            filter: blur(10px);
            opacity: 0.3;
        }

        .story-row:hover .car-card {
            filter: blur(8px);
            opacity: 0.2;
            transform: scale(0.95);
        }

        .story-row .car-card:hover {
            filter: blur(0) !important;
            opacity: 1 !important;
            transform: scale(1.05) !important;
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--crimson);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- SPECS POPUP --- */
        .extra-specs {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 260px;
            background: var(--crimson);
            padding: 25px;
            border-radius: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 110;
        }
        .car-card .extra-specs { left: 105%; }
        .car-card.specs-left .extra-specs { left: auto; right: 105%; }
        .car-card:hover .extra-specs { opacity: 1; visibility: visible; }

        /* --- STRUCTURE CARROUSEL --- */
        .row-wrapper { position: relative; padding: 0 5%; }
        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 2rem;
            padding: 3rem 1rem;
            width: 100%;
            scrollbar-width: none;
        }
        .story-row::-webkit-scrollbar { display: none; }

        .car-card {
            flex: 0 0 calc((100% - 4rem) / 3);
            min-width: 300px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 150;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-prev { left: 1%; }
        .btn-next { right: 1%; }
        .nav-btn:hover { background: var(--crimson); }
    </style>
</head>
<body class="split-bg">

    <div class="main-container">
    <nav class="fixed top-0 w-full z-50 px-6 lg:px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter">SUPER<span class="text-[var(--crimson)]">CAR</span></div>
        
        <ul class="hidden md:flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center">
            <li><a href="acceuil.html" class="hover:text-[var(--crimson)] transition-colors">Accueil</a></li>
            <li><a href="voiture.html" class="hover:text-[var(--crimson)] transition-colors">Voitures</a></li>
            <li><a href="demande.html" class="text-[var(--crimson)]">Essai</a></li>
            <li><a href="services.html" class="hover:text-[var(--crimson)] transition-colors">Services</a></li>
            <li><a href="contact.html" class="hover:text-[var(--crimson)] transition-colors">Contact</a></li>
            <li><a href="connexion.html" class="border border-[var(--crimson)] px-4 py-2 hover:bg-[var(--crimson)] transition-all">Connexion</a></li>
        </ul>
    </nav>

        <main class="pt-40">
            <div class="section-header px-6 lg:px-24 mb-16 relative">
                <div class="absolute left-0 -top-10 outline-text font-title text-8xl opacity-10 select-none uppercase">Inventaire</div>
                <span class="text-[var(--marble)] font-bold tracking-[0.5em] uppercase mb-2 block">Collection Exclusive</span>
                <h1 class="font-title text-5xl md:text-7xl mb-4">NOS <span class="text-[var(--crimson)]">MODÈLES</span></h1>
                <div class="w-32 h-1 bg-[var(--crimson)]"></div>
            </div>

            <section class="mb-20">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest">BMW DIVISION</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-bmw', -1)">❮</button>
                    <div class="story-row" id="row-bmw"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-bmw', 1)">❯</button>
                </div>
            </section>

            <section class="mb-20">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest">MERCEDES BENZ</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-mercedes', -1)">❮</button>
                    <div class="story-row" id="row-mercedes"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-mercedes', 1)">❯</button>
                </div>
            </section>

            <section class="mb-20">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 tracking-widest">TOYOTA RACING</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-toyota', -1)">❮</button>
                    <div class="story-row" id="row-toyota"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-toyota', 1)">❯</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        function injectCars(rowId, carList) {
            const row = document.getElementById(rowId);
            let html = '';
            carList.forEach((car, index) => {
                const sideClass = ((index + 1) % 3 === 0) ? 'specs-left' : '';
                html += `
                <div class="car-card ${sideClass}">
                    <div class="relative overflow-hidden rounded-t-[24px]">
                        <img src="${car.img}" alt="${car.name}" class="w-full h-64 object-cover">
                    </div>
                    <div class="p-8">
                        <span class="text-[var(--crimson)] font-title text-[10px] mb-2 block uppercase">${car.tag}</span>
                        <h3 class="font-title text-lg uppercase mb-6">${car.name}</h3>
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-xl text-[var(--varden)]">${car.price}</p>
                            <button class="bg-[var(--crimson)] px-6 py-2 text-[10px] font-title uppercase tracking-widest hover:bg-white hover:text-black transition-all">Détails</button>
                        </div>
                    </div>
                    <div class="extra-specs font-bold uppercase shadow-2xl">
                        <p class="text-[11px] mb-4 border-b border-white/30 pb-2 font-title text-[var(--varden)]">Fiche Technique</p>
                        <div class="text-[12px] space-y-3 font-light tracking-widest">
                            <p class="flex justify-between"><span>Vitesse Max</span> <span>${car.vmax}</span></p>
                            <p class="flex justify-between"><span>0-100 km/h</span> <span>${car.accel}</span></p>
                            <p class="flex justify-between"><span>Puissance</span> <span>${car.power}</span></p>
                        </div>
                    </div>
                </div>`;
            });
            row.innerHTML = html;
        }

        function scrollRow(rowId, direction) {
            const row = document.getElementById(rowId);
            const scrollAmount = row.clientWidth;
            row.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        const bmwData = [
            { img: 'bmw1.jpg', name: 'BMW M4 Competition', price: 'Rs 5.2M', tag: 'Disponible', vmax: '290km/h', accel: '3.9s', power: '510CH' },
            { img: 'bmw2.jpg', name: 'BMW M5 CS', price: 'Rs 7.8M', tag: 'Édition Limitée', vmax: '305km/h', accel: '3.0s', power: '635CH' },
            { img: 'bmw3.jpg', name: 'BMW M8 Gran Coupe', price: 'Rs 8.5M', tag: 'V8 Turbo', vmax: '305km/h', accel: '3.2s', power: '625CH' },
            { img: 'bmw4.jpg', name: 'BMW Z4 M40i', price: 'Rs 3.9M', tag: 'Cabriolet', vmax: '250km/h', accel: '4.5s', power: '340CH' },
            { img: 'bmw5.jpg', name: 'BMW X6 M', price: 'Rs 6.5M', tag: 'SUV Sport', vmax: '290km/h', accel: '3.8s', power: '625CH' },
            { img: 'bmw6.jpg', name: 'BMW i8 Roadster', price: 'Rs 7.2M', tag: 'Hybride', vmax: '250km/h', accel: '4.6s', power: '374CH' }
        ];

        const mercedesData = [
            { img: 'merc1.jpg', name: 'AMG GT Black Series', price: 'Rs 12M', tag: 'Circuit', vmax: '325km/h', accel: '3.2s', power: '730CH' },
            { img: 'merc2.jpg', name: 'Mercedes C63 AMG', price: 'Rs 4.9M', tag: 'V8 Biturbo', vmax: '290km/h', accel: '3.9s', power: '510CH' },
            { img: 'merc3.jpg', name: 'Mercedes G63 AMG', price: 'Rs 9.2M', tag: 'V8 Legend', vmax: '220km/h', accel: '4.5s', power: '585CH' },
            { img: 'merc4.jpg', name: 'Mercedes SL 63', price: 'Rs 8.1M', tag: 'Luxe', vmax: '315km/h', accel: '3.6s', power: '585CH' },
            { img: 'merc5.jpg', name: 'Mercedes AMG One', price: 'Rs 85M', tag: 'Hypercar', vmax: '350km/h', accel: '2.9s', power: '1063CH' },
            { img: 'merc6.jpg', name: 'Mercedes E63 S', price: 'Rs 5.8M', tag: 'Berline', vmax: '300km/h', accel: '3.4s', power: '612CH' }
        ];

        const toyotaData = [
            { img: 'toy1.jpg', name: 'Supra GR A90', price: 'Rs 4.5M', tag: 'Légende', vmax: '250km/h', accel: '4.3s', power: '340CH' },
            { img: 'toy2.jpg', name: 'Toyota GR Yaris', price: 'Rs 2.8M', tag: 'Rally Tech', vmax: '230km/h', accel: '5.5s', power: '261CH' },
            { img: 'toy3.jpg', name: 'Toyota GR86', price: 'Rs 2.2M', tag: 'Pure Drive', vmax: '226km/h', accel: '6.3s', power: '235CH' },
            { img: 'toy4.jpg', name: 'Supra MK4 (Custom)', price: 'Rs 6.0M', tag: 'Classic', vmax: '280km/h', accel: '4.1s', power: '500CH' },
            { img: 'toy5.jpg', name: 'Toyota GR Corolla', price: 'Rs 3.2M', tag: 'Performance', vmax: '230km/h', accel: '4.9s', power: '300CH' },
            { img: 'toy6.jpg', name: 'Toyota Century V12', price: 'Rs 10M', tag: 'Empereur', vmax: '210km/h', accel: '7.2s', power: '280CH' }
        ];

        injectCars('row-bmw', bmwData);
        injectCars('row-mercedes', mercedesData);
        injectCars('row-toyota', toyotaData);
    </script>
</body>
</html>
