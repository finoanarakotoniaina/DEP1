<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson: #b91c1c;
            --varden: #fffaf0;
            --marble: #f5f5f5;
        }

        body.split-bg {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .font-title { font-family: 'Syncopate', sans-serif; }

        /* --- Conteneur des rangées --- */
        .row-wrapper {
            position: relative;
            padding: 0 4%;
            margin-bottom: 60px;
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 20px;
            padding: 20px 0;
            /* Masque la barre de défilement */
            scrollbar-width: none; 
        }

        .story-row::-webkit-scrollbar {
            display: none;
        }

        /* --- Boutons de Navigation --- */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(185, 28, 28, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 50;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: white;
            color: var(--crimson);
            transform: translateY(-50%) scale(1.1);
        }

        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        /* --- Cartes Voitures --- */
        .car-card {
            min-width: 320px; /* Taille fixe pour permettre le scroll */
            max-width: 320px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            transition: all 0.4s ease;
        }

        .car-card:hover {
            border-color: var(--crimson);
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body class="split-bg">

    <nav class="fixed top-0 w-full z-50 px-6 lg:px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter">SUPER<span class="text-[var(--crimson)]">CAR</span></div>
        <ul class="hidden md:flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center">
            <li><a href="acceuil.html" class="hover:text-[var(--crimson)]">Accueil</a></li>
            <li><a href="voiture.html" class="text-[var(--crimson)]">Voitures</a></li>
            <li><a href="demande.html" class="hover:text-[var(--crimson)]">Essai</a></li>
            <li><a href="services.html" class="hover:text-[var(--crimson)]">Services</a></li>
            <li><a href="contact.html" class="hover:text-[var(--crimson)]">Contact</a></li>
        </ul>
    </nav>

    <main class="pt-40">
        <div class="section-header px-6 lg:px-24 mb-12 relative">
            <h1 class="font-title text-5xl md:text-6xl mb-4">NOS <span class="text-[var(--crimson)]">MODÈLES</span></h1>
            <div class="w-24 h-1 bg-[var(--crimson)]"></div>
        </div>

        <section>
            <h2 class="font-title text-sm px-6 lg:px-24 mb-4 text-gray-500 tracking-[0.3em] uppercase">BMW M-Series</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollRow('row-bmw', -1)">❮</button>
                <div class="story-row" id="row-bmw"></div>
                <button class="nav-btn btn-next" onclick="scrollRow('row-bmw', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-sm px-6 lg:px-24 mb-4 text-gray-500 tracking-[0.3em] uppercase">Mercedes-AMG</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollRow('row-mercedes', -1)">❮</button>
                <div class="story-row" id="row-mercedes"></div>
                <button class="nav-btn btn-next" onclick="scrollRow('row-mercedes', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-sm px-6 lg:px-24 mb-4 text-gray-500 tracking-[0.3em] uppercase">Porsche Performance</h2>
            <div class="row-wrapper">
                <button class="nav-btn btn-prev" onclick="scrollRow('row-porsche', -1)">❮</button>
                <div class="story-row" id="row-porsche"></div>
                <button class="nav-btn btn-next" onclick="scrollRow('row-porsche', 1)">❯</button>
            </div>
        </section>
    </main>

    <script>
        function injectCars(rowId, carList) {
            const row = document.getElementById(rowId);
            let html = '';
            carList.forEach(car => {
                html += `
                <div class="car-card">
                    <img src="${car.img}" alt="${car.name}" class="w-full h-56 object-cover rounded-t-20">
                    <div class="p-6">
                        <span class="text-[var(--crimson)] font-title text-[9px] mb-2 block uppercase tracking-wider">${car.tag}</span>
                        <h3 class="font-title text-md uppercase mb-4 truncate">${car.name}</h3>
                        <div class="flex justify-between items-center border-t border-white/10 pt-4">
                            <p class="font-bold text-lg">${car.price}</p>
                            <button class="bg-[var(--crimson)] px-4 py-2 text-[9px] font-title uppercase hover:bg-white hover:text-black transition-all">Détails</button>
                        </div>
                    </div>
                </div>`;
            });
            row.innerHTML = html;
        }

        function scrollRow(rowId, direction) {
            const row = document.getElementById(rowId);
            const cardWidth = 340; // Largeur carte + gap
            row.scrollBy({ left: direction * cardWidth, behavior: 'smooth' });
        }

        const bmwData = [
            { img: 'bmw1.jpg', name: 'M4 Competition', price: 'Rs 5.2M', tag: 'Dispo' },
            { img: 'bmw2.jpg', name: 'M5 CS', price: 'Rs 7.8M', tag: 'Limited' },
            { img: 'bmw3.jpg', name: 'M8 Gran Coupe', price: 'Rs 8.5M', tag: 'V8' },
            { img: 'bmw4.jpg', name: 'Z4 M40i', price: 'Rs 3.9M', tag: 'Roadster' },
            { img: 'bmw5.jpg', name: 'X6 M', price: 'Rs 6.5M', tag: 'SUV' },
            { img: 'bmw6.jpg', name: 'i8 Roadster', price: 'Rs 7.2M', tag: 'Hybrid' }
        ];

        const mercedesData = [
            { img: 'merc1.jpg', name: 'CLA 45 S', price: 'Rs 3.5M', tag: 'AMG' },
            { img: 'merc2.jpg', name: 'G 63 AMG', price: 'Rs 9.3M', tag: 'Legend' },
            { img: 'merc3.jpg', name: 'EQE Sedan', price: 'Rs 9.2M', tag: 'Electric' },
            { img: 'merc4.jpg', name: 'SL Roadster', price: 'Rs 8.1M', tag: 'Luxury' },
            { img: 'merc5.jpg', name: 'GT 63 S', price: 'Rs 10.5M', tag: 'V8 Biturbo' },
            { img: 'merc6.jpg', name: 'Project One', price: 'Rs 85M', tag: 'Hypercar' }
        ];

        const porscheData = [
            { img: 'p1.jpg', name: '911 GT3 RS', price: 'Rs 15M', tag: 'Track' },
            { img: 'p2.jpg', name: 'Taycan Turbo S', price: 'Rs 9.5M', tag: 'Electric' },
            { img: 'p3.jpg', name: '718 Cayman GT4', price: 'Rs 6.2M', tag: 'Pure' },
            { img: 'p4.jpg', name: 'Panamera Turbo', price: 'Rs 8.8M', tag: 'Limo' },
            { img: 'p5.jpg', name: 'Macan GTS', price: 'Rs 4.5M', tag: 'SUV' },
            { img: 'p6.jpg', name: '918 Spyder', price: 'Rs 65M', tag: 'Icon' }
        ];

        injectCars('row-bmw', bmwData);
        injectCars('row-mercedes', mercedesData);
        injectCars('row-porsche', porscheData);
    </script>
</body>
</html>
