<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        :root { --crimson: #b91c1c; }

        .row-wrapper {
            position: relative;
            padding: 0 60px;
            margin-bottom: 40px;
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 25px;
            padding: 50px 10px;
            scrollbar-width: none;
            /* Empêche la coupure visuelle des specs */
            clip-path: inset(-100px -500px -100px -500px);
        }
        .story-row::-webkit-scrollbar { display: none; }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .car-card {
            min-width: 350px;
            flex-shrink: 0;
            position: relative;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            transition: all 0.4s ease;
        }

        /* --- LOGIQUE DU PANNEAU INFOS --- */
        .hover-specs {
            position: absolute;
            top: 0;
            width: 300px;
            height: 100%;
            background: var(--crimson); 
            color: white;
            padding: 30px;
            border-radius: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        /* COMPORTEMENT PAR DÉFAUT : À DROITE */
        .car-card .hover-specs { 
            left: 105%; 
            box-shadow: 15px 0 30px rgba(0,0,0,0.3);
        }

        /* EXCEPTION : DERNIÈRE VOITURE (Ouverture vers la GAUCHE / Centre écran) */
        .car-card.pos-last .hover-specs { 
            left: auto !important;
            right: 105% !important;
            box-shadow: -15px 0 30px rgba(0,0,0,0.3);
        }

        /* EXCEPTION : PREMIÈRE VOITURE (Ouverture vers la DROITE / Centre écran) */
        .car-card.pos-first .hover-specs { 
            left: 105% !important;
            right: auto !important;
        }

        .car-card:hover { transform: scale(1.02); z-index: 600; }
        .car-card:hover .hover-specs { opacity: 1; visibility: visible; }

        .spec-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 12px 0;
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="split-bg">

    <nav class="fixed top-0 w-full z-[2000] px-6 lg:px-10 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="font-title text-xl tracking-tighter text-white uppercase">SUPER<span class="text-[var(--crimson)]">CAR</span></div>
        <ul class="hidden md:flex gap-8 font-title text-[10px] tracking-[0.2em] uppercase items-center text-white">
            <li><a href="acceuil.html" class="hover:text-[var(--crimson)]">Accueil</a></li>
            <li><a href="voiture.html" class="text-[var(--crimson)]">Voitures</a></li>
            <li><a href="demande.html" class="hover:text-[var(--crimson)]">Essai</a></li>
            <li><a href="services.html" class="hover:text-[var(--crimson)]">Services</a></li>
            <li><a href="contact.html" class="hover:text-[var(--crimson)]">Contact</a></li>
            <li><a href="connexion.html" class="border border-[var(--crimson)] px-4 py-2 hover:bg-[var(--crimson)]">Connexion</a></li>
        </ul>
    </nav>

    <main class="pt-40">
        <div class="section-header px-6 lg:px-24 mb-16 relative text-white">
            <h1 class="font-title text-5xl md:text-7xl mb-4 uppercase">NOS <span class="text-[var(--crimson)]">MODÈLES</span></h1>
            <div class="w-32 h-1 bg-[var(--crimson)]"></div>
        </div>

        <section>
            <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 text-white uppercase tracking-widest">BMW M Series</h2>
            <div class="row-wrapper">
                <button class="nav-btn left-2" onclick="scrollRow('row-bmw', -1)">❮</button>
                <div class="story-row" id="row-bmw"></div>
                <button class="nav-btn right-2" onclick="scrollRow('row-bmw', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 text-white uppercase tracking-widest">Mercedes AMG</h2>
            <div class="row-wrapper">
                <button class="nav-btn left-2" onclick="scrollRow('row-merc', -1)">❮</button>
                <div class="story-row" id="row-merc"></div>
                <button class="nav-btn right-2" onclick="scrollRow('row-merc', 1)">❯</button>
            </div>
        </section>

        <section>
            <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40 text-white uppercase tracking-widest">Porsche</h2>
            <div class="row-wrapper">
                <button class="nav-btn left-2" onclick="scrollRow('row-porsche', -1)">❮</button>
                <div class="story-row" id="row-porsche"></div>
                <button class="nav-btn right-2" onclick="scrollRow('row-porsche', 1)">❯</button>
            </div>
        </section>
    </main>

    <script>
        function injectCars(rowId, carList) {
            const row = document.getElementById(rowId);
            let html = '';
            carList.forEach((car, index) => {
                // On détecte la première et la dernière voiture de la liste
                let posClass = "";
                if (index === 0) posClass = "pos-first";
                if (index === carList.length - 1) posClass = "pos-last";

                html += `
                <div class="car-card ${posClass}">
                    <div class="hover-specs">
                        <p class="font-title text-[10px] mb-4 border-b border-white pb-2 tracking-widest text-center uppercase">Specs</p>
                        <div class="spec-item"><span>État</span> <span>${car.etat}</span></div>
                        <div class="spec-item"><span>Km</span> <span>${car.kilometrage}</span></div>
                        <div class="spec-item"><span>Année</span> <span>${car.annee}</span></div>
                        <div class="spec-item"><span>Énergie</span> <span>${car.carburant}</span></div>
                    </div>
                    <img src="${car.img}" class="w-full h-64 object-cover rounded-t-[24px]">
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-red-600 font-title text-[9px] uppercase">${car.disponibilite}</span>
                            <span class="text-gray-500 text-[10px] uppercase font-bold">${car.motorisation}</span>
                        </div>
                        <h3 class="font-title text-lg uppercase mb-4 text-white">${car.nom}</h3>
                        <p class="font-bold text-2xl text-white">${car.prix}</p>
                    </div>
                </div>`;
            });
            row.innerHTML = html;
        }

        function scrollRow(rowId, direction) {
            document.getElementById(rowId).scrollBy({ left: direction * 400, behavior: 'smooth' });
        }

        // LES 18 VOITURES
        const bmw = [
            { img: 'bmw1.jpg', nom: 'M4 Competition', prix: 'Rs 5.2M', motorisation: 'V6 Biturbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw2.jpg', nom: 'M5 CS', prix: 'Rs 7.8M', motorisation: 'V8 M-Twin', disponibilite: 'Limitée', etat: 'Occasion', kilometrage: '12k km', annee: '2022', carburant: 'Essence' },
            { img: 'bmw3.jpg', nom: 'M8 Gran Coupe', prix: 'Rs 8.5M', motorisation: 'V8 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '200 km', annee: '2023', carburant: 'Essence' },
            { img: 'bmw4.jpg', nom: 'X6 M Competition', prix: 'Rs 6.5M', motorisation: 'V8 Turbo', disponibilite: 'Disponible', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw5.jpg', nom: 'M2 Coupe', prix: 'Rs 4.1M', motorisation: 'L6 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'bmw6.jpg', nom: 'i7 M70', prix: 'Rs 9.2M', motorisation: 'Électrique', disponibilite: 'Rare', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Élec' }
        ];

        const merc = [
            { img: 'merc1.jpg', nom: 'AMG GT 63 S', prix: 'Rs 10.2M', motorisation: 'V8 Twin', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '100 km', annee: '2023', carburant: 'Essence' },
            { img: 'merc2.jpg', nom: 'AMG G 63', prix: 'Rs 9.5M', motorisation: 'V8 Biturbo', disponibilite: 'Sur Commande', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'merc3.jpg', nom: 'EQE 53 AMG', prix: 'Rs 8.9M', motorisation: 'Électrique', disponibilite: 'Disponible', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Élec' },
            { img: 'merc4.jpg', nom: 'SL 63 AMG', prix: 'Rs 11.2M', motorisation: 'V8 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'merc5.jpg', nom: 'C63 S E-Perf', prix: 'Rs 5.8M', motorisation: 'Hybride AMG', disponibilite: 'Disponible', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Hybride' },
            { img: 'merc6.jpg', nom: 'AMG GT Black', prix: 'Rs 18.5M', motorisation: 'V8 Biturbo', disponibilite: 'Rare', etat: 'Neuf', kilometrage: '0 km', annee: '2023', carburant: 'Essence' }
        ];

        const porsche = [
            { img: 'p1.jpg', nom: '911 GT3 RS', prix: 'Rs 15.2M', motorisation: '6 Cyl. Flat', disponibilite: 'Rare', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'p2.jpg', nom: 'Taycan Turbo S', prix: 'Rs 9.8M', motorisation: 'Électrique', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Électrique' },
            { img: 'p3.jpg', nom: '718 Cayman GT4', prix: 'Rs 6.5M', motorisation: 'Flat 6', disponibilite: 'Disponible', etat: 'Occasion', kilometrage: '8k km', annee: '2022', carburant: 'Essence' },
            { img: 'p4.jpg', nom: 'Panamera Turbo', prix: 'Rs 8.4M', motorisation: 'V8 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'p5.jpg', nom: 'Macan GTS', prix: 'Rs 4.7M', motorisation: 'V6 Turbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: 'p6.jpg', nom: '918 Spyder', prix: 'Rs 72M', motorisation: 'V8 Hybride', disponibilite: 'Collection', etat: 'Occasion', kilometrage: '2k km', annee: '2015', carburant: 'Hybride' }
        ];

        injectCars('row-bmw', bmw);
        injectCars('row-merc', merc);
        injectCars('row-porsche', porsche);
    </script>
</body>
</html>
