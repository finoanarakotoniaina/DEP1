<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire | SuperCar Luxury</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- Conteneurs et Scroll --- */
        .row-wrapper {
            position: relative;
            padding: 0 60px;
        }

        .story-row {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 25px;
            padding: 40px 10px;
            scrollbar-width: none;
        }

        .story-row::-webkit-scrollbar { display: none; }

        /* --- Boutons de Navigation --- */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .nav-btn:hover { background: white; color: black; }
        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        /* --- Carte et Système de Panneau Latéral --- */
        .car-card {
            min-width: 350px;
            flex-shrink: 0;
            position: relative;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            transition: transform 0.4s ease;
        }

        /* Panneau Rouge des Caractéristiques */
        .hover-specs {
            position: absolute;
            top: 0;
            width: 280px;
            height: 100%;
            background: #b91c1c; /* Ton Rouge Crimson */
            color: white;
            padding: 30px;
            border-radius: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 150;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }

        /* Logique de positionnement demandée */
        
        /* Par défaut : s'affiche à DROITE */
        .car-card .hover-specs { left: 105%; }

        /* Si c'est une voiture du milieu (classe ajoutée en JS) : s'affiche à GAUCHE */
        .car-card.pos-mid .hover-specs { 
            left: auto;
            right: 105%; 
        }

        /* Si c'est la dernière (classe ajoutée en JS) : s'affiche au MILIEU (par dessus) */
        .car-card.pos-last .hover-specs {
            left: 50%;
            transform: translateX(-50%);
        }

        .car-card:hover { transform: scale(1.02); z-index: 200; }
        .car-card:hover .hover-specs { 
            opacity: 1; 
            visibility: visible; 
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 10px 0;
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="split-bg">

    <div class="main-container">
        <main class="pt-40">
            <div class="section-header px-6 lg:px-24 mb-10">
                <h1 class="font-title text-5xl md:text-7xl mb-4">NOS <span class="text-[var(--crimson)]">MODÈLES</span></h1>
            </div>

            <section class="mb-10">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40">BMW</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-bmw', -1)">❮</button>
                    <div class="story-row" id="row-bmw"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-bmw', 1)">❯</button>
                </div>
            </section>

            <section class="mb-10">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40">Mercedes Benz</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-mercedes', -1)">❮</button>
                    <div class="story-row" id="row-mercedes"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-mercedes', 1)">❯</button>
                </div>
            </section>

            <section class="mb-20">
                <h2 class="font-title text-xl px-6 lg:px-24 mb-4 opacity-40">Porsche</h2>
                <div class="row-wrapper">
                    <button class="nav-btn btn-prev" onclick="scrollRow('row-porsche', -1)">❮</button>
                    <div class="story-row" id="row-porsche"></div>
                    <button class="nav-btn btn-next" onclick="scrollRow('row-porsche', 1)">❯</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        function injectCars(rowId, carList) {
            const row = document.getElementById(rowId);
            let html = '';
            carList.forEach((car, index) => {
                // Détermination de la position pour le panneau rouge
                let posClass = "";
                if (index === 0) posClass = "pos-first"; // À droite par défaut
                else if (index === carList.length - 1) posClass = "pos-last"; // Au milieu
                else posClass = "pos-mid"; // À gauche

                html += `
                <div class="car-card ${posClass}">
                    <div class="hover-specs">
                        <p class="font-title text-[10px] mb-4 border-b border-white pb-2">FICHE TECHNIQUE</p>
                        <div class="spec-item"><span>État:</span> <span>${car.etat}</span></div>
                        <div class="spec-item"><span>Kilométrage:</span> <span>${car.kilometrage}</span></div>
                        <div class="spec-item"><span>Année:</span> <span>${car.annee}</span></div>
                        <div class="spec-item"><span>Carburant:</span> <span>${car.carburant}</span></div>
                    </div>
                    <div class="relative overflow-hidden rounded-t-[24px]">
                        <img src="${car.img}" class="w-full h-64 object-cover">
                    </div>
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[var(--crimson)] font-title text-[9px] uppercase">${car.disponibilite}</span>
                            <span class="text-gray-500 text-[10px] uppercase font-bold">${car.motorisation}</span>
                        </div>
                        <h3 class="font-title text-lg uppercase mb-4">${car.nom}</h3>
                        <p class="font-bold text-2xl text-[var(--varden)]">${car.prix}</p>
                    </div>
                </div>`;
            });
            row.innerHTML = html;
        }

        function scrollRow(rowId, direction) {
            document.getElementById(rowId).scrollBy({ left: direction * 375, behavior: 'smooth' });
        }

        const commonData = (brand) => [
            { img: brand+'1.jpg', nom: brand+' M4', prix: 'Rs 5.2M', motorisation: 'V6 Biturbo', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: brand+'2.jpg', nom: brand+' M5', prix: 'Rs 7.8M', motorisation: 'V8 M-Twin', disponibilite: 'Limitée', etat: 'Occasion', kilometrage: '12k km', annee: '2022', carburant: 'Essence' },
            { img: brand+'3.jpg', nom: brand+' M8', prix: 'Rs 8.5M', motorisation: 'V8 Performance', disponibilite: 'En Stock', etat: 'Neuf', kilometrage: '200 km', annee: '2023', carburant: 'Essence' },
            { img: brand+'4.jpg', nom: brand+' Z4', prix: 'Rs 3.9M', motorisation: '6 Cylindres', disponibilite: 'Disponible', etat: 'Neuf', kilometrage: '0 km', annee: '2024', carburant: 'Essence' },
            { img: brand+'5.jpg', nom: brand+' X6', prix: 'Rs 6.5M', motorisation: 'V8 Turbo', disponibilite: 'En Stock', etat: 'Certifié', kilometrage: '5k km', annee: '2023', carburant: 'Essence' },
            { img: brand+'6.jpg', nom: brand+' i8', prix: 'Rs 7.2M', motorisation: 'Hybride', disponibilite: 'Rare', etat: 'Occasion', kilometrage: '18k km', annee: '2021', carburant: 'Hybride' }
        ];

        injectCars('row-bmw', commonData('bmw'));
        injectCars('row-mercedes', commonData('merc'));
        injectCars('row-porsche', commonData('p'));
    </script>
</body>
</html>
